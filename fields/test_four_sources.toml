# Field file: scalar field definition only (no bounds, frame, or walls).
# Four hidden sources in the 2 m x 4 m tank, used by scenarios/tests/fields.

[units]
# IR-derived scalar measurement value; the latent field before noise.
field_value = "V"

# Hidden ground-truth source positions, used only by the field generator.
[objects.sources]
source_positions = [
    [0.70, 2.00],
    [0.45, 0.90],
    [1.45, 3.00],
    [0.40, 3.30],
]

[simulation.source_defaults]
amplitude = 0.011
sigma_x = 0.35
sigma_y = 0.35
blocking_strength = 1.0

# Noise and clipping affect only field.sample(); the visualization uses the
# noiseless field.evaluate().
[simulation]
background_level = 0.0
measurement_noise_std = 0.0
clip_min = 0.0
clip_max = 0.05
seed = 42

[visualization]
grid_step = 0.01
